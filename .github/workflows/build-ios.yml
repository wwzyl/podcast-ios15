name: Build iOS 15 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare whisper.cpp for iOS
        run: bash scripts/prepare-whisper.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project PodcastIOS15.xcodeproj -scheme PodcastIOS15

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project PodcastIOS15.xcodeproj \
            -scheme PodcastIOS15 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/PodcastIOS15.app build/Payload/
          codesign --force --deep --sign - build/Payload/PodcastIOS15.app
          cd build
          /usr/bin/zip -qry PodcastIOS15-iOS15.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PodcastIOS15-iOS15
          path: build/PodcastIOS15-iOS15.ipa
          if-no-files-found: error
