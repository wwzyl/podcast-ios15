name: Build iOS 15 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen 2.41.0
        run: |
          curl --fail --location --retry 5 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          chmod +x "$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Cache iOS 15 whisper framework
        uses: actions/cache@v4
        with:
          path: Vendor/whisper.xcframework
          key: whisper-cpp-1.9.1-ios15-arm64-coreml-metal-v1

      - name: Prepare whisper.cpp for iOS
        run: bash scripts/prepare-whisper.sh

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate
          OBJECT_VERSION=$(sed -n 's/.*objectVersion = \([0-9][0-9]*\);.*/\1/p' PodcastIOS15.xcodeproj/project.pbxproj | head -n 1)
          echo "Generated Xcode objectVersion=$OBJECT_VERSION"
          if [ -z "$OBJECT_VERSION" ] || [ "$OBJECT_VERSION" -gt 60 ]; then
            echo "Project format is newer than Xcode 15.4 can read."
            exit 1
          fi

      - name: Resolve Swift packages
        run: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project PodcastIOS15.xcodeproj \
            -scheme PodcastIOS15 2>&1 | tee build/logs/resolve-packages.log

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project PodcastIOS15.xcodeproj \
            -scheme PodcastIOS15 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/logs/xcodebuild.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PodcastIOS15-build-logs
          path: build/logs/*.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          MODEL="build/Build/Products/Release-iphoneos/PodcastIOS15.app/ggml-base-q5_1.bin"
          if [ ! -f "$MODEL" ]; then
            echo "Bundled Whisper model is missing from the app."
            exit 1
          fi
          MODEL_SIZE=$(stat -f%z "$MODEL")
          echo "Bundled Whisper model size: $MODEL_SIZE"
          if [ "$MODEL_SIZE" -lt 50000000 ]; then
            echo "Bundled Whisper model is incomplete."
            exit 1
          fi
          COREML="build/Build/Products/Release-iphoneos/PodcastIOS15.app/ggml-base-q5_1-encoder.mlmodelc"
          if [ ! -d "$COREML" ] || [ ! -f "$COREML/weights/weight.bin" ]; then
            echo "Bundled Core ML Whisper encoder is missing."
            exit 1
          fi
          VAD="build/Build/Products/Release-iphoneos/PodcastIOS15.app/silero-vad-unified-256ms-v6.0.0.mlmodelc"
          if [ ! -d "$VAD" ] || [ ! -f "$VAD/weights/weight.bin" ]; then
            echo "Bundled Silero VAD model is missing."
            exit 1
          fi
          WORDS="build/Build/Products/Release-iphoneos/PodcastIOS15.app/words.sqlite"
          if [ ! -f "$WORDS" ]; then
            echo "Bundled COCA frequency database is missing."
            exit 1
          fi
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/PodcastIOS15.app build/Payload/
          codesign --force --deep --sign - build/Payload/PodcastIOS15.app
          cd build
          /usr/bin/zip -qry PodcastIOS15-iOS15.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PodcastIOS15-iOS15
          path: build/PodcastIOS15-iOS15.ipa
          if-no-files-found: error
